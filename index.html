<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>墨海书城 - 小说阅读</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --sub-text: #888888;
    --border: #eeeeee;
    --primary: #2f7df6;
    --primary-hover: #1e6de5;
    --reader-bg: #fffdf6;
    --header-bg: rgba(255,255,255,0.95);
}

body.dark {
    --bg: #181818;
    --card: #242424;
    --text: #e8e8e8;
    --sub-text: #aaaaaa;
    --border: #383838;
    --primary: #4a90ff;
    --primary-hover: #6ca6ff;
    --reader-bg: #202020;
    --header-bg: rgba(36,36,36,0.95);
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* 顶部导航 */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 64px;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1200px;
    height: 64px;
    margin: auto;
    display: flex;
    align-items: center;
    padding: 0 20px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: var(--primary);
    margin-right: 50px;
}

.nav {
    display: flex;
    gap: 25px;
}

.nav a {
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
}

.nav a:hover {
    color: var(--primary);
}

.header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 15px;
}

.search {
    width: 220px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0 15px;
    background: var(--card);
    color: var(--text);
    outline: none;
}

.theme-btn {
    border: none;
    background: var(--primary);
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
}

/* 主体 */

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

/* 小说信息 */

.book-card {
    display: flex;
    gap: 25px;
    background: var(--card);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}

.book-cover {
    width: 180px;
    min-width: 180px;
    height: 250px;
    border-radius: 8px;
    background:
        linear-gradient(
            135deg,
            #172b4d,
            #1f4d7a,
            #4b2d64
        );
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.book-info {
    flex: 1;
}

.book-title {
    font-size: 30px;
    margin-bottom: 15px;
}

.book-meta {
    color: var(--sub-text);
    font-size: 14px;
    margin-bottom: 15px;
}

.tags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.tag {
    padding: 5px 12px;
    border-radius: 15px;
    background: rgba(47,125,246,0.1);
    color: var(--primary);
    font-size: 13px;
}

.book-desc {
    color: var(--sub-text);
    line-height: 1.8;
    max-width: 750px;
}

.book-buttons {
    margin-top: 22px;
    display: flex;
    gap: 12px;
}

.btn {
    border: none;
    padding: 11px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-hover);
}

.btn-secondary {
    background: var(--bg);
    color: var(--text);
}

/* 统计 */

.stats {
    display: flex;
    gap: 40px;
    margin-top: 22px;
}

.stat strong {
    display: block;
    font-size: 20px;
}

.stat span {
    color: var(--sub-text);
    font-size: 13px;
}

/* 内容区域 */

.content {
    display: grid;
    grid-template-columns: 1fr 2.3fr;
    gap: 25px;
}

/* 章节目录 */

.sidebar {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    height: fit-content;
    max-height: 750px;
    overflow-y: auto;
}

.sidebar h2 {
    font-size: 20px;
    margin-bottom: 18px;
}

.chapter-search {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 6px;
    margin-bottom: 15px;
    outline: none;
}

.chapter-list {
    list-style: none;
}

.chapter-list li {
    padding: 13px 5px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 14px;
}

.chapter-list li:hover {
    color: var(--primary);
}

.chapter-list li.active {
    color: var(--primary);
    font-weight: bold;
}

/* 阅读器 */

.reader {
    background: var(--reader-bg);
    border-radius: 12px;
    padding: 45px;
    min-height: 700px;
}

.reader-title {
    text-align: center;
    font-size: 28px;
    margin-bottom: 10px;
}

.reader-info {
    text-align: center;
    color: var(--sub-text);
    font-size: 13px;
    margin-bottom: 35px;
}

.reader-content {
    font-size: 18px;
    line-height: 2;
    max-width: 850px;
    margin: auto;
}

.reader-content p {
    margin-bottom: 20px;
    text-indent: 2em;
}

/* 阅读控制 */

.reader-tools {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 40px;
    padding-top: 25px;
    border-top: 1px solid var(--border);
}

.tool-btn {
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 5px;
    cursor: pointer;
}

.tool-btn:hover {
    color: var(--primary);
}

/* 进度 */

.progress-box {
    margin-top: 30px;
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
}

.progress-title {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 10px;
}

.progress {
    height: 8px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 25%;
    height: 100%;
    background: var(--primary);
    border-radius: 10px;
}

/* 页脚 */

.footer {
    text-align: center;
    color: var(--sub-text);
    font-size: 13px;
    padding: 40px 20px;
}

/* 响应式 */

@media (max-width: 900px) {

    .nav {
        display: none;
    }

    .search {
        display: none;
    }

    .content {
        grid-template-columns: 1fr;
    }

    .sidebar {
        max-height: 400px;
    }
}

@media (max-width: 600px) {

    .container {
        padding: 0 12px;
        margin-top: 15px;
    }

    .book-card {
        flex-direction: column;
        align-items: center;
    }

    .book-info {
        text-align: center;
    }

    .tags,
    .book-buttons,
    .stats {
        justify-content: center;
    }

    .book-desc {
        text-align: left;
    }

    .reader {
        padding: 25px 18px;
    }

    .reader-title {
        font-size: 22px;
    }

    .reader-content {
        font-size: 17px;
        line-height: 1.9;
    }

    .book-cover {
        width: 150px;
        min-width: 150px;
        height: 210px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="logo">
            墨海书城
        </div>

        <nav class="nav">
            <a href="#">首页</a>
            <a href="#">分类</a>
            <a href="#">排行榜</a>
            <a href="#">书架</a>
            <a href="#">完本</a>
        </nav>

        <div class="header-right">
            <input
                class="search"
                placeholder="搜索小说..."
            >

            <button
                class="theme-btn"
                onclick="toggleTheme()"
            >
                ☾
            </button>
        </div>

    </div>
</header>


<div class="container">

    <!-- 小说信息 -->

    <section class="book-card">

        <div class="book-cover">
            星空之门
        </div>

        <div class="book-info">

            <h1 class="book-title">
                星空之门
            </h1>

            <div class="book-meta">
                作者：星河旅人　|　连载中
            </div>

            <div class="tags">
                <span class="tag">科幻</span>
                <span class="tag">未来</span>
                <span class="tag">宇宙</span>
                <span class="tag">冒险</span>
            </div>

            <div class="book-desc">
                当人类第一次打开通往宇宙深处的大门时，
                没有人知道门的另一边究竟隐藏着什么。
                文明、战争、未知生命，以及那些早已消失在历史长河中的古老星际文明。
            </div>

            <div class="book-buttons">

                <button
                    class="btn btn-primary"
                    onclick="scrollToReader()"
                >
                    开始阅读
                </button>

                <button
                    class="btn btn-secondary"
                    onclick="addBookshelf()"
                >
                    加入书架
                </button>

            </div>

            <div class="stats">

                <div class="stat">
                    <strong>128.6万</strong>
                    <span>总字数</span>
                </div>

                <div class="stat">
                    <strong>286</strong>
                    <span>章节</span>
                </div>

                <div class="stat">
                    <strong>24.8万</strong>
                    <span>阅读人数</span>
                </div>

            </div>

        </div>

    </section>


    <div class="content">

        <!-- 章节目录 -->

        <aside class="sidebar">

            <h2>
                章节目录
            </h2>

            <input
                id="chapterSearch"
                class="chapter-search"
                placeholder="搜索章节"
                oninput="searchChapter()"
            >

            <ul
                class="chapter-list"
                id="chapterList"
            >
            </ul>

        </aside>


        <!-- 阅读区域 -->

        <main
            class="reader"
            id="reader"
        >

            <h1
                class="reader-title"
                id="readerTitle"
            >
                第一章 星空
            </h1>

            <div class="reader-info">
                星空之门 · 星河旅人
            </div>

            <div
                class="reader-content"
                id="readerContent"
            >
            </div>


            <div class="reader-tools">

                <button
                    class="tool-btn"
                    onclick="changeFont(-1)"
                >
                    A-
                </button>

                <button
                    class="tool-btn"
                    onclick="changeFont(1)"
                >
                    A+
                </button>

                <button
                    class="tool-btn"
                    onclick="prevChapter()"
                >
                    上一章
                </button>

                <button
                    class="tool-btn"
                    onclick="nextChapter()"
                >
                    下一章
                </button>

            </div>

        </main>

    </div>


    <section class="progress-box">

        <div class="progress-title">

            <span>
                阅读进度
            </span>

            <span id="progressText">
                第 1 / 20 章
            </span>

        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

    </section>

</div>


<footer class="footer">

    © 2026 墨海书城 · 小说阅读网站

</footer>


<script>

const chapters = [
    {
        title: "第一章 星空",
        content: [
            "夜色笼罩着整座城市。",
            "林辰站在实验室的窗前，望着远处逐渐亮起的城市灯光。",
            "在距离地球数十亿公里之外，一束未知的信号正在穿越漫长的宇宙。",
            "没有人知道，这个夜晚将会改变整个人类文明的命运。",
            "实验室中央的设备突然亮起，一串陌生的数据开始疯狂跳动。",
            "林辰缓缓转过身，他知道，某种事情即将发生。"
        ]
    },

    {
        title: "第二章 神秘信号",
        content: [
            "警报声在实验室内响起。",
            "屏幕上的数据不断变化，那些复杂的符号显然不属于任何已知的人类语言。",
            "林辰立刻启动了全球信号分析系统。",
            "几分钟后，一个令人震惊的结果出现了。",
            "信号来自银河系边缘。",
            "而且，它正在向地球发送一份完整的星图。"
        ]
    },

    {
        title: "第三章 星空之门",
        content: [
            "三个月后。",
            "人类历史上最大的宇宙工程正式启动。",
            "来自世界各地的科学家聚集在一起，试图破解那张神秘的星图。",
            "星图的中心，存在着一个未知的坐标。",
            "那里没有恒星，也没有行星。",
            "只有一扇漂浮在宇宙中的巨大金属之门。"
        ]
    },

    {
        title: "第四章 穿越",
        content: [
            "舰队缓缓靠近那扇巨大的门。",
            "没有人知道门后是什么。",
            "林辰坐在指挥舱内，双手紧紧握住扶手。",
            "倒计时开始。",
            "十。",
            "九。",
            "八。",
            "随着最后一个数字归零，整支舰队进入了那片未知的光芒。"
        ]
    },

    {
        title: "第五章 新世界",
        content: [
            "当光芒消失之后。",
            "所有人都被眼前的景象震惊了。",
            "这是一片陌生的星空。",
            "远处存在着数十颗巨大的行星。",
            "而在更远的地方，一座规模惊人的宇宙城市漂浮在黑暗之中。",
            "人类终于意识到，他们并不是宇宙中唯一的文明。"
        ]
    }
];


let currentChapter = 0;
let fontSize = 18;


/* 初始化章节 */

function initChapters() {

    const list =
        document.getElementById("chapterList");

    list.innerHTML = "";

    for (
        let i = 0;
        i < chapters.length;
        i++
    ) {

        const li =
            document.createElement("li");

        li.textContent =
            chapters[i].title;

        li.onclick =
            function () {

                loadChapter(i);

            };

        list.appendChild(li);

    }

}


/* 加载章节 */

function loadChapter(index) {

    currentChapter = index;

    const chapter =
        chapters[index];

    document.getElementById(
        "readerTitle"
    ).textContent =
        chapter.title;


    const content =
        document.getElementById(
            "readerContent"
        );

    content.innerHTML = "";

    chapter.content.forEach(
        function (text) {

            const p =
                document.createElement("p");

            p.textContent = text;

            content.appendChild(p);

        }
    );


    updateActiveChapter();

    updateProgress();

    document
        .getElementById("reader")
        .scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

}


/* 更新当前章节 */

function updateActiveChapter() {

    const items =
        document.querySelectorAll(
            "#chapterList li"
        );

    items.forEach(
        function (
            item,
            index
        ) {

            item.classList.remove(
                "active"
            );

            if (
                index ===
                currentChapter
            ) {

                item.classList.add(
                    "active"
                );

            }

        }
    );

}


/* 上一章 */

function prevChapter() {

    if (
        currentChapter > 0
    ) {

        loadChapter(
            currentChapter - 1
        );

    } else {

        alert(
            "已经是第一章了"
        );

    }

}


/* 下一章 */

function nextChapter() {

    if (
        currentChapter <
        chapters.length - 1
    ) {

        loadChapter(
            currentChapter + 1
        );

    } else {

        alert(
            "已经是最后一章了"
        );

    }

}


/* 修改字体 */

function changeFont(size) {

    fontSize += size;

    if (
        fontSize < 14
    ) {
        fontSize = 14;
    }

    if (
        fontSize > 30
    ) {
        fontSize = 30;
    }

    document
        .getElementById(
            "readerContent"
        )
        .style.fontSize =
            fontSize + "px";

}


/* 阅读进度 */

function updateProgress() {

    const total =
        chapters.length;

    const current =
        currentChapter + 1;

    const percent =
        current / total * 100;


    document
        .getElementById(
            "progressBar"
        )
        .style.width =
            percent + "%";


    document
        .getElementById(
            "progressText"
        )
        .textContent =
            "第 " +
            current +
            " / " +
            total +
            " 章";

}


/* 搜索章节 */

function searchChapter() {

    const keyword =
        document
            .getElementById(
                "chapterSearch"
            )
            .value
            .toLowerCase();


    const items =
        document.querySelectorAll(
            "#chapterList li"
        );


    items.forEach(
        function (item) {

            const text =
                item.textContent
                .toLowerCase();

            if (
                text.indexOf(
                    keyword
                ) !== -1
            ) {

                item.style.display =
                    "";

            } else {

                item.style.display =
                    "none";

            }

        }
    );

}


/* 深色模式 */

function toggleTheme() {

    document.body.classList.toggle(
        "dark"
    );

}


/* 开始阅读 */

function scrollToReader() {

    document
        .getElementById("reader")
        .scrollIntoView({
            behavior: "smooth"
        });

}


/* 加入书架 */

function addBookshelf() {

    alert(
        "已加入书架！"
    );

}


/* 初始化 */

initChapters();

loadChapter(0);

</script>

</body>
</html>
